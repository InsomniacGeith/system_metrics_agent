name: CI/CD Pipeline - System Metrics Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  
  # JOB  : Lintage et Formatage du code (black & flake8)
 
  lint:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances du projet
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Vérifier le formatage avec Black
        run: black --check .

      - name: Analyser la qualité avec Flake8
        run: flake8 . --max-line-length=88 --extend-ignore=E203

 
  # JOB 2 : Tests unitaires (pytest)
  
  test:
    name: Run Unit Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances du projet à partir du cache
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécuter les tests avec Pytest
        run: pytest


  # JOB 3 : Déploiement automatisé sur le VPS
  
  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /DevOps/system_metrics_agent/
            git pull origin main
            pip install -r requirements.txt
