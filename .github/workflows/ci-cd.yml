name: CI/CD Pipeline - System Metrics Agent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # JOB 1 : Lintage et Formatage du code (black & flake8)
  # -------------------------------------------------------------
  lint:
    name: Code Quality (Linting & Formatting)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les outils de Lintage et Formatage
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Vérifier le formatage avec Black
        run: black --check .

      - name: Analyser la qualité avec Flake8
        run: flake8 . --max-line-length=88 --extend-ignore=E203

  # -------------------------------------------------------------
  # JOB 2 : Tests unitaires (pytest)
  # -------------------------------------------------------------
  test:
    name: Run Unit Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances du projet
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Exécuter les tests avec Pytest
        run: pytest

  # -------------------------------------------------------------
  # JOB 3 : Déploiement automatisé sur le VPS
  # -------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /chemin/vers/votre/projet
            git pull origin main
            pip install -r requirements.txt
